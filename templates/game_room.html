<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Game Room</h1>
    <h2>Room Code: {{ room_code }}</h2>
    
    <div id="game-info">
        <p>Current Round: <span id="current-round"></span></p>
        <p>Your Score: <span id="player-score"></span></p>
        <div id="round-result"></div>
    </div>

    <div id="game-play">
        <h3>Choose Your Number for This Round:</h3>
        <input type="number" id="player-choice" min="1" max="{{ num_rounds }}" required>
        <button id="submit-move">Submit</button>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socket.js') }}"></script>
</body>
</html>
