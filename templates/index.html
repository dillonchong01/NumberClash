<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to the Highest Number Game</h1>
        <p class="subtitle">Pick a number - highest wins the round!</p>

        <div id="create-room" class="card">
            <h2>Create a Room</h2>
            <form id="create-room-form">
                <div class="form-group">
                    <label for="num_players">Number of Players (2-4):</label>
                    <input id="num_players" type="number" min="2" max="4" value="2" required>
                </div>
                <div class="form-group">
                    <label for="num_rounds">Number of Rounds (5-50):</label>
                    <input id="num_rounds" type="number" min="5" max="50" value="10" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Room</button>
            </form>
        </div>

        <div id="join-room" class="card">
            <h2>Join a Room</h2>
            <form id="join-room-form">
                <div class="form-group">
                    <label for="room_code">Room Code:</label>
                    <input id="room_code" type="text" placeholder="Enter 4-digit code" maxlength="4" required>
                </div>
                <div class="form-group">
                    <label for="player_name">Your Name:</label>
                    <input id="player_name" type="text" placeholder="Enter your name" maxlength="20" required>
                </div>
                <button type="submit" class="btn btn-primary">Join Room</button>
            </form>
        </div>

        <div id="game-ui" style="display:none;">
            <div class="game-header">
                <h2>Round <span id="current-round">1</span> of <span id="total-rounds">10</span></h2>
            </div>
            
            <div id="players-list" class="players-container">
                <!-- Players will be populated by JavaScript -->
            </div>

            <div class="game-area">
                <h3>Choose Your Number:</h3>
                <div id="number-buttons"></div>
                <div id="waiting-message" style="display:none;"></div>
                <div id="round-results" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
