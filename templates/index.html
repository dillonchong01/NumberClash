<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Welcome to the Game!</h1>
    
    <div id="create-room">
        <h2>Create a Room</h2>
        <form id="create-room-form">
            <label for="num_players">Number of Players (2-4): </label>
            <input type="number" id="num_players" name="num_players" min="2" max="4" required>
            <br>
            <label for="num_rounds">Number of Rounds (5-50): </label>
            <input type="number" id="num_rounds" name="num_rounds" min="5" max="50" required>
            <br>
            <button type="submit">Create Room</button>
        </form>
    </div>
    
    <div id="join-room">
        <h2>Join an Existing Room</h2>
        <form id="join-room-form">
            <label for="room_code">Enter Room Code:</label>
            <input type="text" id="room_code" name="room_code" required>
            <br>
            <label for="player_name">Your Name:</label>
            <input type="text" id="player_name" name="player_name" required>
            <br>
            <button type="submit">Join Room</button>
        </form>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
